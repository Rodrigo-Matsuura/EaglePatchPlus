name: Build EaglePatch+

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-linux-clang:
    name: Build (Linux Clang Cross-Compile)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-mingw-w64-i686 mingw-w64-i686-dev clang lld wine wine32

      - name: Grant execute permissions to build script
        run: chmod +x build_linux.sh

      - name: Run Linux Build and Unit Tests
        run: ./build_linux.sh

      - name: Upload AC1 artifact
        uses: actions/upload-artifact@v4
        with:
          name: EaglePatch-AC1-Linux
          path: dist/EaglePatch+AC1.zip

      - name: Upload AC2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: EaglePatch-AC2-Linux
          path: dist/EaglePatch+AC2.zip

  build-windows-msvc:
    name: Build (Windows MSVC)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure CMake (Win32)
        run: cmake -B build -A Win32 -DCMAKE_BUILD_TYPE=Release

      - name: Build with CMake
        run: cmake --build build --config Release

      - name: Run Unit Tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package Windows Release Archives
        run: |
          New-Item -ItemType Directory -Force -Path dist/EaglePatch+AC1/scripts
          New-Item -ItemType Directory -Force -Path dist/EaglePatch+AC2/scripts
          $ac1 = Get-Item -Path "EaglePatch/bin/EaglePatchAC1.asi", "EaglePatch/bin/Release/EaglePatchAC1.asi", "build/Release/EaglePatchAC1.asi" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $ac1) { $ac1 = Get-ChildItem -Path . -Recurse -Filter "EaglePatchAC1.asi" | Select-Object -First 1 }
          $ac2 = Get-Item -Path "EaglePatch/bin/EaglePatchAC2.asi", "EaglePatch/bin/Release/EaglePatchAC2.asi", "build/Release/EaglePatchAC2.asi" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $ac2) { $ac2 = Get-ChildItem -Path . -Recurse -Filter "EaglePatchAC2.asi" | Select-Object -First 1 }
          Copy-Item $ac1.FullName dist/EaglePatch+AC1/scripts/EaglePatchAC1.asi
          Copy-Item EaglePatch/EaglePatchAC1.ini dist/EaglePatch+AC1/scripts/
          Copy-Item "EaglePatch/Readme - EaglePatch+AC1.txt" dist/EaglePatch+AC1/
          Copy-Item $ac2.FullName dist/EaglePatch+AC2/scripts/EaglePatchAC2.asi
          Copy-Item EaglePatch/EaglePatchAC2.ini dist/EaglePatch+AC2/scripts/
          Copy-Item "EaglePatch/Readme - EaglePatch+AC2.txt" dist/EaglePatch+AC2/
          Compress-Archive -Path dist/EaglePatch+AC1/* -DestinationPath dist/EaglePatch+AC1.zip
          Compress-Archive -Path dist/EaglePatch+AC2/* -DestinationPath dist/EaglePatch+AC2.zip
        shell: pwsh

      - name: Upload AC1 Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: EaglePatch-AC1-Windows
          path: dist/EaglePatch+AC1.zip

      - name: Upload AC2 Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: EaglePatch-AC2-Windows
          path: dist/EaglePatch+AC2.zip

  publish-release:
    name: Publish Release Assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ build-linux-clang, build-windows-msvc ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Linux AC1
        uses: actions/download-artifact@v4
        with:
          name: EaglePatch-AC1-Linux
          path: release-artifacts/linux-ac1

      - name: Download Linux AC2
        uses: actions/download-artifact@v4
        with:
          name: EaglePatch-AC2-Linux
          path: release-artifacts/linux-ac2

      - name: Prepare Release Assets
        run: |
          mkdir -p release-dist
          cp release-artifacts/linux-ac1/EaglePatch+AC1.zip release-dist/EaglePatch+AC1.zip
          cp release-artifacts/linux-ac2/EaglePatch+AC2.zip release-dist/EaglePatch+AC2.zip

      - name: Attach Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-dist/EaglePatch+AC1.zip
            release-dist/EaglePatch+AC2.zip
          generate_release_notes: true
