[EaglePatchAC2]
; ==============================================================================
; Display & Graphics
; ==============================================================================

; Limit framerate (FPS lock) to prevent physics glitches and high refresh rate issues
; Note for Linux / Proton: If experiencing micro-stutters, leave at 0 and use DXVK_FRAME_RATE or VSync.
; Supported values:
;   0 - Disabled (uncapped)
;  60 - 60 FPS (recommended)
; 120, 144, etc. - Custom FPS limit
; Default - 0
FramerateLimit=0

; Improves shadow map resolution from 1024 to 4096 if shadows are maxed out in settings
; Note for Linux / Proton (DXVK): Keep set to 0 to prevent screen flickering/stuttering under Vulkan translation.
; Supported values: 0 - off, 1 - on
; Default - 0
ImproveShadowMapResolution=0

; Improves draw distance for buildings and maxes out draw distance of characters
; Supported values: 0 - off, 1 - on
; Default - 1
ImproveDrawDistance=1

; Run game in borderless windowed mode (currently supported on AC2 Digital UPlay)
; Supported values: 0 - off, 1 - on
; Default - 0
BorderlessWindow=0

; ==============================================================================
; Controls & Input
; ==============================================================================

; Keyboard layout that would be used
; Supported values:
;   0 - KeyboardMouse2
;   1 - KeyboardMouse5
;   2 - Keyboard
;   3 - KeyboardAlt
; Default - 0
KeyboardLayout=0

; Swap triggers to bumpers and bumpers to triggers (e.g. R1/RB becomes run button)
; Works for PS3, PS4, and PS5 layout style controllers
; Supported values: 0 - off, 1 - on
; Default - 0
PS3Controls=0
PS4Controls=0
PS5Controls=0

; Don't patch in the fixes for XInput support to have DirectInput controllers working (not recommended)
; Supported values: 0 - off, 1 - on
; Default - 0
DisableXInputPatch=0

; ==============================================================================
; Quality of Life
; ==============================================================================

; Skip videos on game's launch
; Supported values: 0 - off, 1 - on
; Default - 0
SkipIntroVideos=0

; Enable UPlay bonuses
; Supported values: 0 - off, 1 - on
; Default - 1
UPlayItems=1

; ==============================================================================
; Compatibility & Stability
; ==============================================================================

; Set the process affinity to limit CPU cores (fixes game crashing at startup when using a CPU with a high core count > 16 threads)
; Note for Linux / Proton: Keep set to 0 as Wine/Proton manages CPU scheduling automatically.
; Supported values:
;   0 - Disabled (uses all available cores)
;   1 - Enabled (automatically limits to 8 logical cores/threads to prevent crashes while avoiding CPU starvation/stutter)
;   4, 6, 8, etc. - Custom number of cores to limit to
; Default - 0
LimitCpuCores=0

; Enable diagnostic logging to EaglePatchAC2.log (useful for troubleshooting startup issues or controller detection)
; Supported values: 0 - off, 1 - on
; Default - 0
EnableLogging=0
; Display an alert dialog if an unsupported or unrecognized game executable version is detected
; Supported values: 0 - off, 1 - on
; Default - 1
NotifyOnUnsupportedVersion=1
